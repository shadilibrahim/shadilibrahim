name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # Daily at 06:17 UTC
  workflow_dispatch: {}    # Manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write          # Needed to commit refreshed files

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 4. Scrape live contribution data → contributions.json
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      # 5. Re-render the SVG from the JSON
      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      # 6. Generate today's daily log entry
      - name: Update daily log
        run: python scripts/update_daily_log.py

      # 7. Commit & push both files in one auto-commit
      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily update — heatmap + dev log [skip ci]"
          file_pattern: "contrib-heatmap.svg daily-log.md .daily_streak"
